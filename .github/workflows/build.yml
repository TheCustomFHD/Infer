name: build

# One workflow, two jobs.
#
#   build     runs on every push and pull request. Builds all four x86
#             targets, runs the tests, asserts the platform guarantees,
#             and uploads the binaries as an artifact you can download
#             from the Actions tab.
#
#   release   runs ONLY for a tag like vX.Y.Z. It does not rebuild --
#             it downloads the artifact the `build` job just verified,
#             packages it with checksums, and publishes a GitHub
#             Release.
#
# Keeping them in one file with `needs: build` means the build and
# verification logic exists exactly once, and a release can only ever
# contain binaries that passed CI. Two separate workflows would have
# duplicated the verify block, and the two copies would drift.
#
# ---------------------------------------------------------------------
# TO CUT A RELEASE
# ---------------------------------------------------------------------
#
#   1. Bump the version in BOTH places (make checkversion asserts this):
#        src/infer.h   #define INFER_VERSION "X.Y.Z"
#        Makefile      VERSION = X.Y.Z
#
#   2. git commit -am "X.Y.Z"
#      git tag vX.Y.Z
#      git push && git push --tags
#
# The tag must match VERSION. The workflow fails loudly if it does not,
# because a release whose tag and binaries disagree is worse than none.
#
# The version is read from `make version`, never hardcoded, so bumping
# it cannot break this file.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A push to a branch that also has a PR open would otherwise run this
# twice. Cancel the older run of the same ref; never cancel a tag,
# because that run publishes a release.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # Two transactions, deliberately.
      #
      # apt-get install is ATOMIC: if any single name on the line cannot
      # be resolved, apt exits 100 and installs NOTHING -- not even the
      # packages that were fine. Run #32 proved it. One optional
      # cross-compiler was unavailable, the whole line aborted, and
      # `|| echo ::warning::` turned "no compilers at all" into a green
      # step. Four steps later the run died with exit 127 on
      # `i686-w64-mingw32-gcc: not found`, which reads like a mingw
      # problem and is not one.
      #
      # So: REQUIRED goes in its own transaction with no `||` at all --
      # if the x86 toolchain is missing there is no useful run to have,
      # and it must say so here rather than 127 later. OPTIONAL goes in
      # a second transaction, one package at a time, so an unavailable
      # sparc cross-compiler costs us sparc and nothing else.
      #
      # Both groups still install before any compile happens. That is
      # what finding 41 needs: pulling a cross-toolchain in mid-run once
      # dragged in a linux-libc-dev that dropped the i386 headers
      # gcc-multilib wants, and a target that built an hour earlier
      # failed with "asm/errno.h: No such file".
      - name: install toolchains (required)
        run: |
          sudo add-apt-repository -y universe || true
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-multilib \
            libc6-dev-i386 \
            gcc-mingw-w64-i686-win32 \
            binutils-mingw-w64-i686 \
            gcc-mingw-w64-x86-64-win32 \
            binutils-mingw-w64-x86-64 \
            qemu-user-static

      # Best-effort, and genuinely optional: SPARC and s390x only widen
      # coverage. Installed individually so one missing package cannot
      # take the others down with it.
      #
      # On Ubuntu `linux-libc-dev` is arch-qualified (amd64/i386), not
      # `Architecture: all` as on Debian. The sparc64/s390x cross libcs
      # depend on their own linux-libc-dev-*-cross, and satisfying them
      # can upgrade or replace the shared `linux-libc-dev`, taking the
      # i386 headers with it -- finding 41 all over again. apt is not
      # wrong: nothing in that transaction declared it needed i386.
      #
      # So we name `linux-libc-dev:i386` explicitly, and re-assert it
      # AFTER the cross toolchains, so the i386 headers are a stated
      # requirement of the final state rather than a leftover.
      - name: install toolchains (optional cross targets)
        run: |
          for p in gcc-sparc64-linux-gnu libc6-dev-sparc64-cross \
                   gcc-s390x-linux-gnu; do
            if sudo apt-get install -y "$p"; then
              echo "  $p: installed"
            else
              echo "::warning::$p unavailable -- its target will be skipped"
            fi
          done
          # Re-assert the 32-bit headers. If a cross package displaced
          # them this puts them back; if not, this is a no-op.
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            linux-libc-dev:i386 libc6-dev-i386

      # Prove each target can actually compile before any step relies on
      # it. A capability check fails in one place, with one message,
      # instead of surfacing three steps later as a missing header.
      #
      # x86_32 and win32 are REQUIRED: they are the shipped artifacts.
      # If either is missing the run is worthless, so fail here with a
      # sentence that names the cause. Previously every target was
      # advisory, so a run with no compilers at all sailed past this
      # step and died later on an unrelated-looking 127.
      #
      # sparc and s390x are advisory -- they gate their own steps.
      - name: probe which targets are usable
        id: probe
        run: |
          # The probe must compile what the PROJECT compiles, not
          # `int main(void){return 0;}`. Run #34 proved why: a trivial
          # program needs no kernel headers, so it links happily while
          # `asm/errno.h` is missing, the probe reports "x86_32: yes",
          # and `make all` then dies on src/net_posix.c. A capability
          # check that is easier than the real build is not a check.
          #
          # net_posix.c is the file that has actually broken twice, so
          # the probe pulls the same headers it does.
          cat > /tmp/p.c <<'EOF'
          #include <stdio.h>
          #include <errno.h>
          #include <sys/types.h>
          #include <sys/socket.h>
          #include <netinet/in.h>
          #include <arpa/inet.h>
          int main(void){ return (int)sizeof(struct sockaddr_in) * 0; }
          EOF
          # mingw has no POSIX sockets; give it the winsock equivalent.
          cat > /tmp/pw.c <<'EOF'
          #include <stdio.h>
          #include <winsock2.h>
          #include <ws2tcpip.h>
          int main(void){ return (int)sizeof(struct sockaddr_in) * 0; }
          EOF
          ok() { echo "$1=yes" >> "$GITHUB_OUTPUT"; echo "  $1: yes"; }
          no() { echo "$1=no"  >> "$GITHUB_OUTPUT"; echo "::warning::$1 unavailable"; }

          # ASK THE MAKEFILE which compilers it intends to invoke,
          # rather than repeating their names here. Run #36 failed
          # because 1.18.0 added a second mingw (x86_64-w64-mingw32-gcc
          # for the new 64-bit Windows builds) and this workflow still
          # listed only the 32-bit one -- so apt never installed it,
          # the probe never looked for it, and `make all` died at the
          # first `make windows BITS=64`. Deriving the names means a
          # new toolchain can never again be missing from CI without
          # the probe noticing.
          CC32=$(make -s printvar VAR=CC     2>/dev/null || echo cc)
          WCC32=$(make -s printvar VAR=WINCC   2>/dev/null || echo i686-w64-mingw32-gcc)
          WCC64=$(make -s printvar VAR=WINCC64 2>/dev/null || echo x86_64-w64-mingw32-gcc)
          echo "  compilers the Makefile wants: $CC32 / $WCC32 / $WCC64"

          req=0
          if $CC32 -m32 -D_FILE_OFFSET_BITS=64 -o /tmp/p32 /tmp/p.c 2>/tmp/e32; then
            ok x86_32
          else
            echo "::error::x86_32 unusable -- '$CC32 -m32' cannot compile the"\
                 "system headers src/net_posix.c needs. The 32-bit kernel"\
                 "headers (linux-libc-dev:i386) or libc6-dev-i386 are missing."
            sed 's/^/    /' /tmp/e32; req=1
          fi
          if $WCC32 -o /tmp/p32.exe /tmp/pw.c 2>/tmp/ewin; then
            ok win32
          else
            echo "::error::win32 unusable -- $WCC32 cannot compile the"\
                 "winsock headers src/net_win32.c needs."\
                 "(package: gcc-mingw-w64-i686-win32)"
            sed 's/^/    /' /tmp/ewin; req=1
          fi
          if $WCC64 -o /tmp/p64.exe /tmp/pw.c 2>/tmp/ewin64; then
            ok win64
          else
            echo "::error::win64 unusable -- $WCC64 cannot compile the"\
                 "winsock headers src/net_win32.c needs. 'make all' builds"\
                 "infer-*-windows64.exe and windows64-avx2.exe with it."\
                 "(package: gcc-mingw-w64-x86-64-win32)"
            sed 's/^/    /' /tmp/ewin64; req=1
          fi
          if [ "$req" -ne 0 ]; then
            echo "::error::Required toolchains are missing or incomplete."\
                 "Stopping here rather than failing later in 'make all'"\
                 "with an error that points at the wrong component."
            exit 1
          fi

          if sparc64-linux-gnu-gcc -static -o /tmp/psp /tmp/p.c 2>/dev/null \
             && qemu-sparc64-static /tmp/psp; then ok sparc; else no sparc; fi
          if s390x-linux-gnu-gcc -static -o /tmp/ps390 /tmp/p.c 2>/dev/null \
             && qemu-s390x-static /tmp/ps390; then ok s390x; else no s390x; fi

      # Everything below refers to $LINUX / $WIN instead of a literal
      # version, so a VERSION bump cannot break the workflow.
      - name: resolve version and binary names
        id: v
        run: |
          V=$(make version)
          echo "version=$V"                         >> "$GITHUB_OUTPUT"
          echo "LINUX=infer-$V-linux"               >> "$GITHUB_ENV"
          echo "WIN=infer-$V-windows.exe"           >> "$GITHUB_ENV"
          echo "WIN64=infer-$V-windows64.exe"        >> "$GITHUB_ENV"
          echo "LINUX64=infer-$V-linux64" >> "$GITHUB_ENV"

      - name: Makefile VERSION matches src/infer.h
        run: make checkversion

      - name: tag matches VERSION (tagged builds only)
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          V=$(make version)
          echo "tag=$TAG  makefile=$V"
          if [ "$TAG" != "$V" ]; then
            echo "::error::tag v$TAG does not match VERSION $V"
            exit 1
          fi

      - name: confirm the win32 (not posix) mingw variant
        run: |
          i686-w64-mingw32-gcc --version | head -1
          # Do not grep for "thread-model=": some Debian builds do not
          # print it at all, and the check would abort the whole run
          # under `set -e`. Test the property we actually care about
          # instead -- the posix variant links libwinpthread-1.dll,
          # which would break the three-DLL guarantee.
          echo 'int main(void){return 0;}' > /tmp/probe.c
          i686-w64-mingw32-gcc -o /tmp/probe.exe /tmp/probe.c
          n=$(i686-w64-mingw32-objdump -p /tmp/probe.exe \
              | grep -ci 'libwinpthread' || true)
          echo "libwinpthread imports: $n (want 0)"
          test "$n" -eq 0

      - name: build all four x86 targets
        run: |
          make all
          ls -l "$LINUX" "$LINUX64" "$WIN" "$WIN64"
          ./"$LINUX" --version

      # The probe can only check compilers it knows about. This asserts
      # the probe knows about ALL of them, by asking `make -n all` which
      # binaries it would actually invoke and confirming each one exists.
      # Without this, adding a target with a new toolchain silently
      # bypasses the probe -- which is exactly how run #36 happened.
      - name: the probe covers every compiler 'make all' uses
        run: |
          make clean >/dev/null
          missing=0
          for c in $(make -n all 2>/dev/null \
                     | grep -oE '(^|[[:space:]])[a-z0-9_]+(-[a-z0-9_]+)*-(gcc|cc)\b' \
                     | tr -d ' ' | sort -u); do
            if command -v "$c" >/dev/null 2>&1; then
              echo "  $c: present"
            else
              echo "::error::'make all' invokes '$c' but it is not installed,"\
                   "and the probe step did not catch it. Add it to the"\
                   "required-toolchains step and to the probe."
              missing=1
            fi
          done
          test "$missing" -eq 0
          make all >/dev/null

      - name: unit tests
        run: |
          make test
          ./build/t_align
          ./build/t_agent
          ./build/t_endian
          ./build/t_jinja

      # THE central guarantee: ONE binary per platform that starts on a
      # 486 and still uses AVX2 on a Haswell. That needs two things to
      # be true at once, and they pull in opposite directions:
      #
      #   every object EXCEPT backend_avx2.o must be 486-clean, and
      #   backend_avx2.o must be full of ymm.
      #
      # If the two-stage compile ever collapses into one command, the
      # first assertion fails (whole binary gets -mavx2) or the second
      # does (AVX2 never compiled). Both are caught here.
      - name: one binary, 486 baseline outside the gated AVX2 object
        run: |
          for spec in "$LINUX:objdump" "$LINUX64:objdump" \
                      "$WIN:i686-w64-mingw32-objdump" \
                      "$WIN64:x86_64-w64-mingw32-objdump"; do
            f="${spec%%:*}"; od="${spec##*:}"
            y=$($od -d "$f" --no-show-raw-insn | grep -c '%ymm' || true)
            v=$($od -d "$f" --no-show-raw-insn | grep -c 'vpmaddubsw' || true)
            x=$($od -d "$f" --no-show-raw-insn | grep -c 'xgetbv' || true)
            m=$($od -d "$f" --no-show-raw-insn \
                | grep -cE 'pmaddwd|punpcklbw' || true)
            echo "$f: ymm=$y vpmaddubsw=$v xgetbv=$x mmx=$m"
            # AVX2 kernel present...
            test "$y" -gt 100
            test "$v" -gt 0
            # ...and gated on OS ymm support, not just CPUID
            test "$x" -gt 0
            # ...and the MMX kernel is still there for the Geode
            test "$m" -gt 100
          done

      # Our own objects -- everything except the deliberately gated
      # backend_avx2.c -- must contain no CMOV and no SSE/AVX at all.
      - name: baseline objects contain no CMOV and no SSE/AVX
        run: |
          bad=0
          for f in src/*.c; do
            case "$f" in *win32*|*_vis*|*_avx2*) continue;; esac
            gcc -std=gnu89 -O3 -m32 -march=i486 -mtune=generic -mmmx \
                -mno-sse -mno-sse2 -mfpmath=387 \
                -DINFER_HAVE_MMX -DINFER_HAVE_AVX2 -DINFER_HAVE_THREADS \
                -D_FILE_OFFSET_BITS=64 -Isrc -c -o /tmp/chk.o "$f" || continue
            n=$(objdump -d /tmp/chk.o --no-show-raw-insn \
                | grep -cE '^[[:space:]]+[0-9a-f]+:[[:space:]]+(cmov|.*%xmm|.*%ymm)' \
                || true)
            if [ "$n" -ne 0 ]; then
              echo "::error::$f has $n non-486 instructions"; bad=1
            fi
          done
          test "$bad" -eq 0

      # The AVX2 backend must be REGISTERED in a baseline build. It is
      # gated on INFER_HAVE_AVX2, not __AVX2__, because backend.c is
      # compiled at the i486 baseline where __AVX2__ is false -- testing
      # the wrong macro silently drops the kernel from every artifact.
      - name: the shipped 32-bit binary offers avx2 and still runs on a P2
        run: |
          ./"$LINUX" --backend list
          ./"$LINUX" --backend list | grep -q '^  avx2'
          ./"$LINUX" --backend list | grep -q '^  mmx'
          for cpu in pentium2 pentium3 core2duo; do
            echo "-- $cpu"
            qemu-i386-static -cpu $cpu ./"$LINUX" --backend list \
              | grep -q 'mmx.*selected'
          done
          qemu-i386-static -cpu Haswell ./"$LINUX" --backend list \
            | grep -q 'avx2.*selected'

      # The whole point of backend_avx2.c is one instruction. If a
      # refactor stops emitting it the kernel silently degrades to
      # something the compiler could already do, and only a benchmark
      # would notice. Assert it directly.
      - name: the AVX2 kernel really uses VPMADDUBSW
        run: |
          # Covered by "one binary, 486 baseline outside the gated AVX2
          # object" above; this step now only guards the float-contract
          # flag, which is a numerical property rather than an ISA one.
          echo "see the single-binary step above"

      # The AVX2 k-quant kernels are deliberately NOT bit-identical
      # since 1.20.0 (Q8_K-style activation plane, integer-domain
      # scaling, reassociated sums). t_ident still covers mmx/i8/ref;
      # t_avx2acc bounds the AVX2 error against the float reference,
      # and t_thread proves threading does not perturb anything.
      - name: kernels are exact where they claim to be, accurate elsewhere
        run: |
          make i8-split-test
          ./build/t_avx2sat
          ./build/t_ident
          make clean >/dev/null
          make i8-split-test BITS=64 ISA=avx2
          ./build/t_avx2sat
          ./build/t_scales
          ./build/t_avx2acc
          # t_thread loops over every backend by name (finding 52):
          # testing only the one `auto` picks left mmx unthreaded by
          # any test, and mmx was the backend that raced.
          ./build/t_thread
          ./build/t_thread 1
          ./build/t_thread 4
          ./build/t_thread 8
          make clean >/dev/null
          make all

      # No kernel may keep per-call scratch in a `static`: the thread
      # pool splits rows across workers, so a shared buffer is a data
      # race that produces plausible-looking wrong output rather than
      # a crash. (Finding 52.)
      - name: no static scratch in the backends
        run: |
          n=$(grep -nE '^[[:space:]]+static [a-z_ ]+[a-zA-Z_]+\[' \
              src/backend.c src/backend_mmx.c src/backend_avx2.c \
              | grep -v const | wc -l)
          echo "static scratch arrays in backend sources: $n (want 0)"
          if [ "$n" -ne 0 ]; then
            grep -nE '^[[:space:]]+static [a-z_ ]+[a-zA-Z_]+\[' \
              src/backend.c src/backend_mmx.c src/backend_avx2.c | grep -v const
            exit 1
          fi

      - name: threading defaults to one thread
        run: |
          # Threading is opt-in. A user who never asked for it must not
          # get it -- that is how the mmx race reached a release.
          ./"$LINUX" run /nonexistent.gguf -v 2>&1 | grep -q 'threads: 1'

      - name: NO_THREADS=1 compiles the pool away
        run: |
          make clean >/dev/null
          make linux NO_THREADS=1
          # the pool must be gone, not merely unused
          n=$(nm "$LINUX" 2>/dev/null | grep -c 'pthread_create' || true)
          echo "pthread_create references: $n (want 0)"
          test "$n" -eq 0
          ./"$LINUX" --backend list | grep -q 'avx2'
          make clean >/dev/null
          make all

      - name: AVX2 build does not contract floats away from the others
        run: |
          grep -q 'AVX2ARCH.*-ffp-contract=off' Makefile
          n=$(x86_64-w64-mingw32-objdump -d "$WIN64" --no-show-raw-insn \
              | grep -cE 'vfmadd|vfmsub' || true)
          echo "fused multiply-adds in the avx2 exe: $n (want 0)"
          test "$n" -eq 0

      # Our objects must be 486-clean even though the linked binary
      # needs a Pentium II (glibc's _dl_aux_init uses CMOV -- see
      # finding 34). This checks what we control.
      - name: our own objects contain no CMOV and no SSE/AVX
        run: |
          bad=0
          for f in src/*.c; do
            case "$f" in *win32*|*_vis*) continue;; esac
            gcc -std=gnu89 -O2 -m32 -march=i486 -mtune=geode -mmmx \
                -mno-sse -mno-sse2 -mfpmath=387 -DINFER_HAVE_MMX \
                -D_FILE_OFFSET_BITS=64 -Isrc -c -o /tmp/chk.o "$f" || continue
            n=$(objdump -d /tmp/chk.o --no-show-raw-insn \
                | grep -cE '^[[:space:]]+[0-9a-f]+:[[:space:]]+(cmov|.*%xmm|.*%ymm)' || true)
            if [ "$n" -ne 0 ]; then echo "::error::$f has $n non-486 instructions"; bad=1; fi
          done
          test "$bad" -eq 0

      # The default build must keep selecting the hand-written MMX
      # kernel. If a change ever makes `auto` pick something else here,
      # the 486/Geode target has silently changed behaviour.
      # The 64-bit artifact is a different promise: it targets x86-64,
      # so SSE2 is guaranteed and `auto` should take the vectorised i8.
      - name: artifacts select avx2 on this runner
        run: |
          # GitHub runners are Haswell or later, so `auto` must reach
          # the AVX2 kernel in BOTH word sizes -- that is the whole
          # point of the single-binary layout.
          for b in "$LINUX" "$LINUX64"; do
            ./"$b" --backend list
            ./"$b" --backend list | grep -qE '^  avx2.*selected'
          done

      - name: mmx is still offered and still chosen without AVX2
        run: |
          # The Geode/486 path must survive. mmx is listed, and a CPU
          # without AVX2 must fall back to it rather than fault.
          ./"$LINUX" --backend list | grep -qE '^  mmx'
          qemu-i386-static -cpu core2duo ./"$LINUX" --backend list \
            | grep -qE '^  mmx.*selected'

      - name: shipped binary runs on an emulated Pentium II
        run: |
          qemu-i386-static -cpu pentium2 ./"$LINUX" --backend list
          qemu-i386-static -cpu pentium2 ./"$LINUX" --backend list \
            | grep -q 'mmx.*selected'

      - name: i486 baseline -- no CMOV emitted for ordinary code
        run: |
          # Checked on a NO_AVX2=1 build: backend_avx2.o is compiled
          # -march=haswell and may legitimately use CMOV inside the
          # gated kernel, which a 486 never reaches. Everything else
          # must be 486-clean.
          make clean >/dev/null
          make linux NO_AVX2=1
          n=$(objdump -d "$LINUX" --no-show-raw-insn \
              | grep -cE '^[[:space:]]+[0-9a-f]+:[[:space:]]+cmov[a-z]+' || true)
          echo "cmov instructions (NO_AVX2=1): $n"
          test "$n" -eq 0
          make clean >/dev/null
          make all

      - name: MMX kernels really are compiled in
        run: |
          n=$(objdump -d "$LINUX" | grep -cE 'pmaddwd|punpcklbw' || true)
          echo "mmx instructions: $n"
          test "$n" -gt 100

      - name: all three backends are present
        run: |
          ./"$LINUX" --backend list
          ./"$LINUX" --backend list | grep -q '^  mmx'
          ./"$LINUX" --backend list | grep -q '^  i8'
          ./"$LINUX" --backend list | grep -q '^  ref'

      # -------------------------------------------------------------
      # The shipped binary must be GENERIC: every accelerated kernel
      # compiled in, none of them reachable unless the CPU has it.
      # These two checks are the whole promise of "one binary".
      # -------------------------------------------------------------
      - name: all SSE/AVX in the shipped binary is inside the gated object
        run: |
          # The binary DOES contain ymm now -- that is the point. What
          # must hold is that all of it lives in backend_avx2.o, which
          # is unreachable unless CPUID and XGETBV both agree. The
          # per-file assertion above proves the other objects are
          # clean; this proves the gated object is the only source, by
          # rebuilding without it and requiring zero.
          make clean >/dev/null
          make linux NO_AVX2=1
          n=$(objdump -d "$LINUX" --no-show-raw-insn \
              | grep -cE '%xmm|%ymm' || true)
          echo "xmm/ymm with NO_AVX2=1: $n (want 0)"
          test "$n" -eq 0
          make clean >/dev/null
          make windows NO_AVX2=1
          n=$(i686-w64-mingw32-objdump -d "$WIN" --no-show-raw-insn \
              | grep -cE '%xmm|%ymm' || true)
          echo "windows xmm/ymm with NO_AVX2=1: $n (want 0)"
          test "$n" -eq 0
          make clean >/dev/null
          make all

      - name: every build flag still builds
        run: |
          for f in "PROFILE=1" "NATIVE=1" "BITS=64" "NO_MMX=1" \
                   "NO_SSE2=1" "NO_AVX2=1" "NO_THREADS=1" \
                   "BITS=64 PROFILE=1"; do
            echo "== make linux $f =="
            make clean >/dev/null
            make linux $f
          done
          # Restore the shipping artifacts: later steps and the upload
          # both refer to $LINUX / $WIN by name.
          make clean >/dev/null
          make all

      # -------------------------------------------------------------
      # SPARC / Solaris. No Solaris runner exists, so this
      # cross-compiles with sparc64-linux-gnu-gcc and runs the tests
      # under qemu. It catches endianness and VIS breakage, which is
      # what has actually gone wrong on that target historically.
      # -------------------------------------------------------------
      - name: SPARC cross-build (big-endian, VIS in and out)
        if: steps.probe.outputs.sparc == 'yes'
        run: |
          for f in "" "NO_VIS=1" "PROFILE=1"; do
            echo "== solaris $f =="
            make clean >/dev/null
            make solaris TOOLCHAIN=gcc GNUCC=sparc64-linux-gnu-gcc \
                 SOLLIBS=-lm $f
          done
          make clean >/dev/null
          make all

      # These run under emulation, so a failure can be OUR bug or the
      # emulator's. Print enough to tell the two apart before deciding.
      - name: SPARC kernels are bit-exact under qemu
        if: steps.probe.outputs.sparc == 'yes'
        continue-on-error: true
        run: |
          echo "--- toolchain ---"
          sparc64-linux-gnu-gcc --version | head -1
          qemu-sparc64-static --version | head -1
          echo
          make solaris-test TOOLCHAIN=gcc \
               GNUCC="sparc64-linux-gnu-gcc -static" SOLLIBS=-lm
          rc=0
          for t in t_vis t_viskern t_vissat t_endian; do
            echo "== $t =="
            # Print the test's own output on failure: t_vis and
            # t_viskern name the exact (weight, activation) pair or
            # tensor that disagreed, which is what distinguishes an
            # emulator artefact from a real kernel bug.
            qemu-sparc64-static build/$t || {
              rc=1
              echo "::warning::SPARC test $t failed under qemu $(qemu-sparc64-static --version | head -1)"
            }
          done
          make clean >/dev/null
          make all
          exit $rc

      - name: SPARC binary runs without VIS on a CPU that lacks it
        if: steps.probe.outputs.sparc == 'yes'
        run: |
          # A no-VIS build must still select a working backend rather
          # than falling over -- that is the "gated" half of generic.
          make solaris TOOLCHAIN=gcc NO_VIS=1 \
               GNUCC="sparc64-linux-gnu-gcc -static" SOLLIBS=-lm
          qemu-sparc64-static "$(make version | sed 's/^/infer-/')-solaris" \
              --backend list
          make clean >/dev/null
          make all

      - name: --kernel selection works and stays exact
        run: |
          ./"$LINUX" --kernel list
          ./"$LINUX" --kernel bench -v
          ./"$LINUX" --kernel q6k=i8 | grep -q 'q6k'
          # bad input must be reported, never silently accepted
          ! ./"$LINUX" --kernel nope=i8 2>&1 | grep -q 'bad --kernel' && exit 1
          ! ./"$LINUX" --kernel q4k=nosuch >/dev/null 2>&1 || exit 1

      - name: host-side kernel exactness (no model needed)
        run: |
          make i8-split-test && ./build/t_i8split && ./build/t_q5split \
            && ./build/t_ident
          make vis-shim-test && ./build/t_viskern_sun && ./build/t_viskern_gcc
          make clean >/dev/null
          make all

      - name: windows exe imports only XP-safe DLLs
        run: |
          i686-w64-mingw32-objdump -p "$WIN" | grep 'DLL Name'
          test "$(i686-w64-mingw32-objdump -p "$WIN" | grep -c 'DLL Name')" -eq 3
          # no post-XP API may be imported
          n=$(i686-w64-mingw32-objdump -p "$WIN" \
              | grep -coE '\b(GetTickCount64|InitializeCriticalSectionEx|CreateFile2|InetPton|GetAddrInfoW|SetThreadStackGuarantee)\b' || true)
          test "$n" -eq 0
          file "$WIN" | grep -q 'PE32 executable'

      - name: big-endian build and test (s390x under qemu)
        if: steps.probe.outputs.s390x == 'yes'
        run: |
          s390x-linux-gnu-gcc -std=c89 -pedantic -Wall -Wextra \
            -Wno-unused-parameter -O2 -static -o t_endian_be \
            tests/t_endian.c src/gguf.c src/quant.c src/backend.c \
            src/util.c src/prof.c src/tpool.c src/backend_a2stub.c \
            src/sys_posix.c -lm
          qemu-s390x-static ./t_endian_be
          # the whole program must link for a big-endian target too
          s390x-linux-gnu-gcc -std=c89 -O2 -static -o infer_be \
            src/main.c src/opts.c src/server.c src/chat.c src/agent.c \
            src/jinja.c src/jinja_eval.c src/mcp.c src/qwen35.c \
            src/tokenizer.c src/sampler.c src/quant.c src/backend.c \
            src/gguf.c src/json.c src/util.c src/prof.c src/tpool.c \
            src/backend_a2stub.c src/net_posix.c src/sys_posix.c -lm
          rm -f t_endian_be infer_be

      - name: strict C90, no long long, with large-file support
        run: |
          # This combination is what broke the Solaris build: off_t
          # becomes a 64-bit type and C90 has no name for one.
          gcc -std=c89 -pedantic -Werror=long-long -Wall -Wextra \
              -Wno-unused-parameter -m32 -D_FILE_OFFSET_BITS=64 \
              -c src/sys_posix.c -o /tmp/sys_posix.o

      - name: every toggle is accepted in every mode that documents it
        run: |
          for m in serve chat run; do
            for f in "--system S" "--think" "--think off" "--raw" \
                     "--tool-rounds 2" "--quiet-tools" "--temp 0.5" \
                     "--mcp http://127.0.0.1:1/mcp" "--template /dev/null"; do
              if ./"$LINUX" $m /nonexistent.gguf $f 2>&1 \
                   | grep -q 'has no effect'; then
                echo "REGRESSION: $m rejects $f"; exit 1
              fi
            done
          done

      - name: options that do not apply are reported, not ignored
        run: |
          ./"$LINUX" run x.gguf --port 9 2>&1 | grep -q 'has no effect'
          ./"$LINUX" serve x.gguf -p hi 2>&1 | grep -q 'has no effect'

      - name: --think is one switch and does not eat the next option
        run: |
          ./"$LINUX" chat /nonexistent.gguf --no-think 2>&1 \
            | grep -q 'unknown option'
          ./"$LINUX" chat /nonexistent.gguf --think banana 2>&1 \
            | grep -q 'expects on or off'

      - name: logging is opt-in, and says so when it cannot comply
        run: |
          # --log-stages on a build WITHOUT timers must explain itself,
          # and must do so before touching the model. Since 1.18.0 the
          # shipped binaries all carry the timers, so this has to be
          # checked against a deliberately timer-less build rather than
          # against $LINUX -- which is why the old form of this step
          # started failing the moment the artifacts changed.
          make clean >/dev/null
          make linux >/dev/null
          ./"$LINUX" run /nonexistent.gguf --log-stages 2>&1 \
            | grep -q 'INFER_PROFILE'
          make clean >/dev/null
          make all >/dev/null
          # every shipped build has the timers, and must stay silent
          # unless they are asked for
          ! ./"$LINUX" run /nonexistent.gguf 2>&1 | grep -q 'STAGE PROFILE'

      - name: no bundled chat template (third-party work is not vendored)
        run: |
          test ! -f templates/qwen-fixed-v21.3.jinja
          ls templates/

      - name: upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: infer-${{ steps.v.outputs.version }}-binaries
          if-no-files-found: error
          path: |
            infer-*-linux
            infer-*-linux64
            infer-*-windows.exe
            infer-*-windows64.exe

  # -------------------------------------------------------------------
  # Only for tags. Publishes what `build` already verified -- it does
  # not rebuild, so the released binaries are byte-for-byte the ones
  # that passed every check above.
  # -------------------------------------------------------------------
  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: download the verified binaries
        uses: actions/download-artifact@v4
        with:
          name: infer-${{ needs.build.outputs.version }}-binaries
          path: bin

      - name: assemble the release
        env:
          VER: ${{ needs.build.outputs.version }}
        run: |
          mkdir -p "release/infer-$VER"
          cp bin/* "release/infer-$VER/"
          chmod +x "release/infer-$VER"/infer-*-linux*
          cp CHANGELOG.md LICENSE "release/infer-$VER/"
          cp .github/RELEASE-README.txt "release/infer-$VER/README-BINARIES.txt"
          ( cd "release/infer-$VER" && sha256sum * > SHA256SUMS && cat SHA256SUMS )
          ( cd release && zip -9 -rX "../infer-$VER-binaries.zip" "infer-$VER" )

          # git archive packages the tagged COMMIT. Confirm that commit
          # really carries this version -- tagging before committing a
          # version bump would otherwise ship a source zip whose
          # infer.h disagrees with the binaries beside it.
          git archive --format=zip --prefix="infer-$VER/" \
            -o "infer-$VER-source.zip" HEAD
          ARCHV=$(git show HEAD:src/infer.h \
                  | sed -n 's/^#define INFER_VERSION "\(.*\)"/\1/p')
          echo "version in the tagged commit: $ARCHV"
          if [ "$ARCHV" != "$VER" ]; then
            echo "::error::tagged commit has INFER_VERSION=$ARCHV, expected $VER."
            echo "::error::Commit the version bump before tagging."
            exit 1
          fi
          ls -l "infer-$VER-binaries.zip" "infer-$VER-source.zip"

      # Pull the newest CHANGELOG section into the release body, so the
      # notes are the ones actually written for this version instead of
      # a fixed blurb nobody updates.
      - name: release notes from CHANGELOG
        env:
          VER: ${{ needs.build.outputs.version }}
        run: |
          # everything from the first "## " heading to just before the next
          awk '/^## /{n++; if(n>1) exit} n==1' CHANGELOG.md > notes.md
          head -1 notes.md | grep -q "$VER" || {
            echo "::error::newest CHANGELOG section is not for $VER:"
            head -1 notes.md
            exit 1
          }
          {
            echo
            echo "---"
            echo
            echo "### Downloads"
            echo
            echo "| file | notes |"
            echo "|---|---|"
            echo "| \`infer-$VER-windows.exe\` | Windows 32-bit -- runs on XP / 486+ / Geode |"
            echo "| \`infer-$VER-windows64.exe\` | Windows 64-bit |"
            echo "| \`infer-$VER-linux\` | Linux 32-bit -- runs on a 486 |"
            echo "| \`infer-$VER-linux64\` | Linux 64-bit |"
            echo
            echo "**One binary per platform.** Every one carries the MMX,"
            echo "AVX2, i8 and ref kernels and picks the fastest your CPU"
            echo "supports at startup, after a CPUID probe (plus XGETBV for"
            echo "AVX2, because Windows XP never saved \`ymm\` state and an"
            echo "XP box on modern silicon must fall back, not crash)."
            echo
            echo "There is no ISA ladder to choose from any more: no"
            echo "\`-sse2\` or \`-avx2\` download, and no way to pick wrong."
            echo "Check what yours selected with \`--backend list\`."
            echo
            echo "Every binary carries **all** the x86 kernels (\`mmx\`, \`i8\`,"
            echo "\`ref\`) and picks one at run time after a CPUID probe."
            echo
            echo "All four are built at the **i486 baseline**: only"
            echo "\`backend_avx2.c\` is compiled with \`-mavx2\`, into its own"
            echo "object, reached through the runtime gate. So the same"
            echo "file that boots on a Geode uses VPMADDUBSW on a Haswell."
            echo
            echo "In practice the 32-bit binaries need a **Pentium II or"
            echo "later**: our own objects contain no CMOV, but glibc and the"
            echo "mingw CRT do."
            echo
            echo "Solaris/SPARC is not shipped as a binary -- the toolchain"
            echo "cannot be redistributed. Build it with \`gmake solaris\`;"
            echo "CI cross-compiles and tests it under qemu on every push."
            echo
            echo "\`\`\`sh"
            echo "sha256sum -c SHA256SUMS"
            echo "\`\`\`"
          } >> notes.md
          echo "--- release body ---"
          cat notes.md

      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          name: infer ${{ needs.build.outputs.version }}
          body_path: notes.md
          files: |
            infer-${{ needs.build.outputs.version }}-binaries.zip
            infer-${{ needs.build.outputs.version }}-source.zip
